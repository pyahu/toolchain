# Pyahu Community — Cloud & Kubernetes overlay (MISE_ENV=cloud)

[env]
# Resolve the shims from this repository, including when this file is symlinked
# into mise's global config directory by install.sh.
_.path = ["{{ config_source | canonicalize | dirname }}/bin"]

[tools]
# kubernetes
kubectl = "1.37.0"
kubectx = "0.11.0"
kubens = "0.11.0"
k9s = "0.51.0"
kind = "0.33.0"
k3d = "5.9.0"
helm = "4.2.4"
telepresence = "2.31.2"

# gitops
kustomize = "5.8.1"
argocd = "3.5.2"
flux2 = "2.9.5"
sops = "3.13.3"
age = "1.3.2"

# cloud
awscli = "2.36.44"
doctl = "1.168.0"
hcloud = "1.67.0"
terraform = "1.16.2"
"pipx:oci-cli" = "3.92.1"

# database clients & rpc
grpcurl = "1.9.4"
"pipx:pgcli" = "4.6.0"
"pipx:mycli" = "2.23.0"

# pyahu
# Local dev stack on k3d (`pyahu up`), declared per repo in pyahu.yaml. Pinned to the
# exact patch on purpose: the repos that consume it (e.g. unilog/all) pin the same
# version, so every machine builds the same stack.
"github:pyahu/cli" = "0.10.1"
