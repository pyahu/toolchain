<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pyahu Toolchain</title>
  <desc id="desc">A practical mise setup for everyday developer CLI tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="pyahu-mark" x1="14" y1="10" x2="106" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="55" r="180" fill="#4051b5" opacity=".16"/>
  <circle cx="1130" cy="390" r="230" fill="#0f766e" opacity=".12"/>

  <g transform="translate(72 66) scale(.7666667)">
    <path fill="url(#pyahu-mark)" fill-rule="evenodd"
      d="M14 106V14h38c21 0 34 11.5 34 28.5S73 71 52 71H33v35H14Zm19-51h17c10.5 0 17-5.5 17-13.5S60.5 28 50 28H33v27Z"/>
    <circle cx="100" cy="100" r="9" fill="url(#pyahu-mark)"/>
  </g>

  <text x="192" y="122" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700">Pyahu Toolchain</text>
  <rect x="72" y="180" width="470" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="236" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">A practical mise setup for everyday CLI tools.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(72 282)">
      <rect width="150" height="48" rx="24" fill="#1e293b" stroke="#475569"/>
      <text x="75" y="31" text-anchor="middle" fill="#e2e8f0">67 tools</text>
    </g>
    <g transform="translate(238 282)">
      <rect width="150" height="48" rx="24" fill="#1e293b" stroke="#475569"/>
      <text x="75" y="31" text-anchor="middle" fill="#e2e8f0">9 profiles</text>
    </g>
    <g transform="translate(404 282)">
      <rect width="310" height="48" rx="24" fill="#1e293b" stroke="#475569"/>
      <text x="155" y="31" text-anchor="middle" fill="#e2e8f0">Linux x64 · macOS arm64</text>
    </g>
  </g>

  <text x="72" y="376" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">mise install · exact stable pins · safe uninstall</text>
