# Pyahu Community certified toolchain (base)
#
# Developer CLI tools managed by mise (https://mise.jdx.dev): no Docker image,
# pinned per repo, identical on every machine.
#
# This file is the "minimal" baseline: shell, modern unix utilities, git workflow,
# containers helper, and an editor. Stack language/cloud overlays on top with MISE_ENV.
#
#   MISE_ENV=java          → + mise.java.toml   (Java & Kotlin)
#   MISE_ENV=go            → + mise.go.toml
#   MISE_ENV=python        → + mise.python.toml
#   MISE_ENV=node          → + mise.node.toml   (Next.js / Vue / TypeScript)
#   MISE_ENV=cloud         → + mise.cloud.toml  (Kubernetes, GitOps, Terraform)
#   MISE_ENV=ai            → + mise.ai.toml
#   MISE_ENV=arch          → + mise.arch.toml   (architecture / diagrams-as-code)
#   MISE_ENV=java,cloud,ai → stack several (this is the old "full" profile)
#
# Versions track current stable lines; `mise outdated` / `mise upgrade` bumps them.
# OS-level prerequisites not managed here: git, zsh, curl, docker, a Nerd Font, vim,
# and btop (no macOS binaries in the mise registry — `brew install btop` / `apt install btop`).

[tools]
# shell & prompt
starship = "1.26"
fzf      = "0.74"
zoxide   = "0.10"

# modern unix utilities
ripgrep = "15"
fd      = "10"
bat     = "0.26"
eza     = "0.23"
dust    = "1"
glow    = "3"
yazi    = "26"
jq      = "1.8"
yq      = "4"
"pipx:httpie" = "3.2.4"

# git workflow
"github-cli" = "2"
delta        = "0.19"
lazygit      = "0.64"

# containers & editor
lazydocker = "0.25"
neovim     = "0.12"
