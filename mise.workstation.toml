[tools]
# shell & navigation
starship = "1.26"
fzf      = "0.74"
zoxide   = "0.10"

# terminal utilities
bat             = "0.26"
eza             = "0.23"
dust            = "1"
glow            = "3"
yazi            = "26"
"pipx:httpie" = "3.2.4"

# collaboration & git workflow
"github-cli"             = "2"
glab                     = "1"
"npm:@schpet/linear-cli" = "2.6.0"
delta                    = "0.19"
lazygit                  = "0.65.0"

# containers, processes & editor
lazydocker = "0.25"
mprocs     = "0.9"
tmux       = "3"
neovim     = "0.12"
