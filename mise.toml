# Pyahu Community certified toolchain (base)
#
# Developer CLI tools managed by mise (https://mise.jdx.dev): no Docker image,
# pinned per repo, identical on every machine.
#
# This file is the minimal, non-opinionated baseline: source search and structured-data
# processing. Stack workflow profiles on top with MISE_ENV.
#
#   MISE_ENV=workstation   → + terminal UX, git clients, TUIs, editor
#   MISE_ENV=java          → + mise.java.toml   (Java & Kotlin)
#   MISE_ENV=go            → + mise.go.toml
#   MISE_ENV=python        → + mise.python.toml
#   MISE_ENV=node          → + mise.node.toml   (Next.js / Vue / TypeScript)
#   MISE_ENV=cloud         → + mise.cloud.toml  (Kubernetes, GitOps, Terraform)
#   MISE_ENV=ai            → + mise.ai.toml
#   MISE_ENV=arch          → + mise.arch.toml   (architecture / diagrams-as-code)
#   MISE_ENV=java,cloud,ai → stack several profiles at once
#
# Versions track current stable lines; `mise outdated` / `mise upgrade` bumps them.
# Profile-specific prerequisites are documented in docs/profiles.md.

[tools]
# cross-stack primitives
ripgrep = "15"
fd      = "10"
jq      = "1.8"
yq      = "4"
