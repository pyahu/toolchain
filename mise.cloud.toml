# Pyahu Community — Cloud & Kubernetes overlay (MISE_ENV=cloud)

[env]
# Resolve the shims from this repository, including when this file is symlinked
# into mise's global config directory by install.sh.
_.path = ["{{ config_source | canonicalize | dirname }}/bin"]

[tools]
# kubernetes
kubectl = "1.37.2"
kubectx = "0.11.0"
kubens = "0.11.0"
k9s = "0.51.0"
kind = "0.33.0"
k3d = "5.9.0"
helm = "4.3.2"
telepresence = "2.33.3"

# gitops
kustomize = "5.8.3"
argocd = "3.6.2"
flux2 = "2.10.1"
sops = "3.13.3"
age = "1.3.2"

# cloud
awscli = { version = "2.41.2", symlink_bins = "true" }
doctl = "2.7.0"
hcloud = "1.70.2"
terraform = "1.17.2"
"pipx:oci-cli" = "3.96.3"

# database clients & rpc
grpcurl = "1.9.4"
"pipx:pgcli" = "4.7.1"
# sqlglotc (mycli dependency) ships no wheels for Python 3.15 yet; pin the tool venv to 3.14
"pipx:mycli" = { version = "2.31.1", uvx_args = "--python 3.14" }

# pyahu
# Local dev stack on k3d (`pyahu up`), declared per repo in pyahu.yaml. Pinned to the
# exact patch on purpose: the repos that consume it (e.g. unilog/all) pin the same
# version, so every machine builds the same stack.
"github:pyahu/cli" = "0.12.3"
