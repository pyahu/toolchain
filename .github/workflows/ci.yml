name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # mise queries the GitHub API to resolve versions; the token avoids rate limits
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  overlay:
    name: install (linux, ${{ matrix.env || 'base' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ["", "workstation", "java", "go", "python", "node", "cloud", "ai", "arch"]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: mise install
        run: |
          if [ "$MISE_ENV" = ai ]; then
            mise install
          else
            mise install --locked
          fi
        env:
          MISE_ENV: ${{ matrix.env }}
      - name: mise ls
        run: mise ls
        env:
          MISE_ENV: ${{ matrix.env }}

  installer:
    name: install.sh (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: catalog consistency
        run: ./scripts/catalog.py --check

      - name: installer behavior
        run: ./tests/install.sh

      - name: fresh install links everything and tools actually run
        run: |
          export MISE_CONFIG_DIR="$RUNNER_TEMP/mise-config"
          ./install.sh workstation java go python node cloud ai arch
          MISE_ENV=workstation,java,go,python,node,cloud,arch mise install
          MISE_ENV=node,ai mise install
          MISE_ENV=node,ai mise exec -- kimi --version
          MISE_ENV=node,ai mise exec -- pi --version
          MISE_ENV=ai mise exec -- claude --version
          MISE_ENV=ai mise exec -- codex --version
          MISE_ENV=ai mise exec -- opencode --version
          MISE_ENV=ai mise exec -- ollama --version

  macos:
    name: install (macos, everything)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: mise install
        run: |
          MISE_ENV=workstation,java,go,python,node,cloud,arch mise install --locked
          MISE_ENV=node,ai mise install
        env:
          MISE_ENV: workstation,java,go,python,node,cloud,arch
      - name: mise ls
        run: mise ls
        env:
          MISE_ENV: workstation,java,go,python,node,cloud,ai,arch
