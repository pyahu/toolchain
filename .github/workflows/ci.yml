name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Avoid API rate limits and make the runner itself reproducible.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_VERSION: 2026.9.5

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: mise formatting
        run: mise fmt --check

      - name: ShellCheck
        run: mise x shellcheck@0.11.0 -- shellcheck install.sh bin/* tests/*.sh scripts/*.sh

      - name: workflow lint
        run: mise x actionlint@1.7.12 shellcheck@0.11.0 -- actionlint

      - name: Renovate configuration
        run: mise x node@24.20.0 -- npx --yes --package renovate@44.82.3 renovate-config-validator --strict renovate.json

      - name: documentation consistency
        run: ./scripts/catalog.py --check

      - name: installer behavior
        run: ./tests/install.sh

      - name: kubectl plugin shims
        run: ./tests/shims.sh

  overlay:
    name: install (linux, ${{ matrix.env || 'base' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: ""
            smoke: rg --version
          - env: workstation
            smoke: starship --version
          - env: java
            smoke: java --version
          - env: go
            smoke: go version
          - env: python
            smoke: uv --version
          - env: node
            smoke: node --version
          - env: cloud
            smoke: kubectl version --client
          - env: ai
            smoke: ollama --version
          - env: arch
            smoke: d2 --version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
      - name: mise install
        run: |
          if [ "$MISE_ENV" = ai ]; then
            mise install
          else
            mise install --locked
          fi
        env:
          MISE_ENV: ${{ matrix.env }}
      - name: representative binary
        run: mise exec -- ${{ matrix.smoke }}
        env:
          MISE_ENV: ${{ matrix.env }}

  installer:
    name: global install (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: fresh install links everything and tools actually run
        run: |
          export MISE_CONFIG_DIR="$RUNNER_TEMP/mise-config"
          ./install.sh workstation java go python node cloud ai arch
          MISE_ENV=workstation,java,go,python,node,cloud,arch mise install
          MISE_ENV=node,ai mise install
          MISE_ENV=node,ai mise exec -- kimi --version
          MISE_ENV=node,ai mise exec -- pi --version
          MISE_ENV=ai mise exec -- claude --version
          MISE_ENV=ai mise exec -- codex --version
          MISE_ENV=ai mise exec -- opencode --version
          MISE_ENV=ai mise exec -- ollama --version

  macos:
    name: install (macos, everything)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
      - name: mise install
        run: |
          MISE_ENV=workstation,java,go,python,node,cloud,arch mise install --locked
          MISE_ENV=node,ai mise install
      - name: representative binaries
        run: |
          mise exec -- rg --version
          mise exec -- starship --version
          mise exec -- java --version
          mise exec -- go version
          mise exec -- uv --version
          mise exec -- node --version
          mise exec -- kubectl version --client
          mise exec -- ollama --version
          mise exec -- d2 --version
        env:
          MISE_ENV: workstation,java,go,python,node,cloud,ai,arch
