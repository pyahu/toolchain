# Pyahu Community — Cloud & Kubernetes overlay (MISE_ENV=cloud)

[env]
# kubectl plugin shims that install.sh links here, so `kubectl ctx` / `kubectl ns`
# (and `k ctx` / `k ns`) drive kubectx and kubens the way the krew plugins do.
_.path = ["{{env.HOME}}/.config/mise/bin"]

[tools]
# kubernetes
kubectl      = "1.36"
kubectx      = "0.11"
kubens       = "0.11"
k9s          = "0.51"
kind         = "0.32"
k3d          = "5.9"
helm         = "4"
telepresence = "2"

# gitops
kustomize = "5"
argocd    = "3"
flux2     = "2"
sops      = "3"
age       = "1"

# cloud
awscli         = "2"
doctl          = "1"
terraform      = "1.15"
"pipx:oci-cli" = "3.91.0"

# database clients & rpc
grpcurl       = "1.9"
"pipx:pgcli"  = "4.6.0"
"pipx:mycli"  = "2.17.0"
