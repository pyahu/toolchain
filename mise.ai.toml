# Pyahu Community — AI agents overlay (MISE_ENV=ai)
#
# Deliberately unpinned: AI CLIs ship fixes weekly and old versions age badly,
# so this overlay tracks latest instead of the pinned lines used elsewhere.

[settings]
# AI CLIs age quickly, but still avoid releases from the last 24 hours.
minimum_release_age = "24h"

[tools]
claude-code = "latest"   # Anthropic Claude Code
codex       = "latest"   # OpenAI Codex CLI
opencode    = "latest"   # OpenCode
ollama      = "latest"   # Ollama, local model runtime for the agents above
"npm:@moonshot-ai/kimi-code" = "latest"   # Kimi Code CLI (kimi); needs Node, stack with MISE_ENV=node,ai
"npm:@earendil-works/pi-coding-agent" = "latest"   # Pi coding agent (pi); needs Node >=22, stack with MISE_ENV=node,ai
