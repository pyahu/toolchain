  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="55" r="180" fill="#4051b5" opacity=".16"/>
  <circle cx="1130" cy="390" r="230" fill="#0f766e" opacity=".12"/>

