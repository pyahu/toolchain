name: Docs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - mise*.toml
      - catalog.toml
      - website/**
      - scripts/catalog.py
      - scripts/cloudflare-build.sh
      - scripts/docs-check.py
      - scripts/site.sh
      - scripts/site-check.py
      - scripts/stage-site-docs.py
      - wrangler.jsonc
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - mise*.toml
      - catalog.toml
      - website/**
      - scripts/catalog.py
      - scripts/cloudflare-build.sh
      - scripts/docs-check.py
      - scripts/site.sh
      - scripts/site-check.py
      - scripts/stage-site-docs.py
      - wrangler.jsonc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: install website dependencies
        run: |
          npm ci
          npm audit --audit-level=high
        working-directory: website

      - name: validate sources
        run: |
          ./scripts/catalog.py --check
          ./scripts/docs-check.py

      - name: build site
        run: |
          npm run check
          npm run build
        working-directory: website

      - name: validate generated site
        run: ./scripts/site-check.py
